<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Guardian</title>
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-card-hover: #222240;
      --accent: #4f8cff;
      --accent-hover: #3a7bff;
      --success: #2ed573;
      --warning: #ffa502;
      --danger: #ff4757;
      --critical: #8b0000;
      --text-primary: #e1e1e6;
      --text-secondary: #8e8ea0;
      --text-muted: #5c5c6e;
      --border: #2a2a40;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      min-height: 500px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }
    #root { min-height: 500px; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
